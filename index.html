<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMOSD — Sistem Informasi Mobil Siaga Desa Kalikurmo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Import Map untuk React & Lucide Icons langsung di Browser -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.2.0",
      "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
      "lucide-react": "https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0"
    }
  }
  </script>
  <!-- Kompilator JSX Otomatis untuk GitHub Pages -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 antialiased">
  <div id="root">
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #94a3b8; gap: 12px;">
      <div style="width: 36px; height: 36px; border: 3px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <div>Memuat Sistem Informasi Mobil Siaga Desa Kalikurmo...</div>
    </div>
    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
  </div>

  <script type="module">
    async function startApp() {
      const candidatePaths = ['./App.jsx', './app.jsx', './src/App.jsx'];
      let response = null;

      for (const path of candidatePaths) {
        const res = await fetch(path + '?v=' + Date.now());
        if (res.ok) {
          response = res;
          break;
        }
      }

      if (!response) {
        throw new Error('File App.jsx belum ditemukan. Pastikan Anda sudah membuat file bernama App.jsx di sebelah index.html pada repository GitHub.');
      }

      let rawCode = await response.text();

      // Ubah export default menjadi fungsi biasa agar bisa langsung di-render
      rawCode = rawCode.replace(/export\s+default\s+function\s+App/, 'function App');
      rawCode += `\nimport { createRoot as __createRoot } from 'react-dom/client';\n__createRoot(document.getElementById('root')).render(<App />);\n`;

      const compiledCode = window.Babel.transform(rawCode, {
        presets: ['react'],
        filename: 'App.jsx'
      }).code;

      const scriptEl = document.createElement('script');
      scriptEl.type = 'module';
      scriptEl.textContent = compiledCode;
      document.body.appendChild(scriptEl);
    }

    startApp().catch((err) => {
      document.getElementById('root').innerHTML = `
        <div style="max-width: 600px; margin: 60px auto; padding: 24px; background: #1e293b; border: 1px solid #ef4444; border-radius: 16px; font-family: sans-serif; color: #f8fafc;">
          <h3 style="color: #f87171; margin-top: 0;">Gagal Memuat Aplikasi</h3>
          <p style="color: #cbd5e1; line-height: 1.6;">${err.message}</p>
        </div>
      `;
      console.error(err);
    });
  </script>
</body>
</html>
